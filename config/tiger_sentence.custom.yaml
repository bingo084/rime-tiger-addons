# 虎整辅助功能模板；个人按键与中英切换设置由使用者保留。
patch:
  engine/segmentors/@before 0: matcher
  engine/processors:
  - lua_processor@*zqj_stats_proc
  - lua_processor@tiger_sentence_ascii
  - lua_processor@*tiger_emoji_processor
  - recognizer
  - lua_processor@*tiger_kf_processor
  - lua_processor@*tiger_punct_alt
  - lua_processor@tiger_sentence_processor
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  schema/dependencies/+:
  - pinyin_simp
  - tiger_lookup
  recognizer/patterns/yin_add_user: ^`[A-Za-z']*$
  engine/segmentors/@before 2: affix_segmentor@yin_add_user
  engine/translators:
  - punct_translator
  - script_translator@yin_add_user
  - lua_translator@*tiger_yin_guard
  yin_add_user:
    tag: yin_add_user
    dictionary: pinyin_simp
    prefix: '`'
    tips: 〔小鹤反查〕
    initial_quality: -1
    enable_completion: true
    enable_user_dict: false
    enable_auto_phrase: false
    spelling_hints: 50
  engine/filters/+:
  - lua_filter@*tiger_yin_comment
  - lua_filter@*tiger_chaifen
  - lua_filter@*tiger_emoji
  - uniquifier
  recognizer/patterns/punct: ^/([0-9]0?|[A-Za-z]+)$
  speller/alphabet: zyxwvutsrqponmlkjihgfedcba;'0123456789~/
  speller/initials: abcdefghijklmnopqrstuvwxyz~/
  punctuator/import_preset: tiger_sentence_symbols
  engine/translators/+:
  - lua_translator@*zqj_stats
